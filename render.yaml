services:
  - type: web
    name: rexy-api
    repo: https://github.com/Itaxh1/render-backend
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: REXY_WEB_ORIGIN
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: REXY_EMBED_SUMMARIES
        value: "1"
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4.3
